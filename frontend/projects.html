<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Proje detayları ve açıklamaları">
    <title>Proje Detayları</title>
    <link rel="stylesheet" href="/static/css/pj.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Geri dönüş butonu -->
    <div class="go-back-container">
        <button class="go-back" onclick="history.back()" aria-label="Önceki sayfaya dön">
            <p>Geri Dön</p>
        </button>
    </div>

    <!-- Üst bölüm - Grid layout -->
    <section class="top-bar" aria-label="Proje açıklaması">
        <div class="top-bar-content">
            <p class="image-desc">
            </p>
        </div>
        <div class="top-bar-image">
            <img src="" alt="Proje görseli 1" loading="lazy">
        </div>
    </section>

    <!-- Bağlantı çizgisi -->
    <div class="connection" aria-hidden="true"></div>

    <!-- Alt bölüm - Grid layout -->
    <section class="bottom-bar" aria-label="Proje detayları">
        <div class="bottom-bar-image">
            <img src="" alt="Proje görseli 2" loading="lazy">
        </div>
        <div class="bottom-bar-content">
            <p class="image-desc-1">
            </p>
        </div>
    </section>

    <!-- GitHub Linki -->
    <section class="toGitHub">
        <div class="toGitHub-content">
            <a href="https://github.com/YENESDGN/">
                <img src="/static/assets/images/github.png" alt="github_logo" class="github_logo">
            </a>
        </div>
        <div class="github-link">
            <a href="https://github.com/YENESDGN/">
               <p>GitHub'da Görüntüle</p>
            </a>
        </div>
    </section>

    <script src="/static/js/projects.js"></script>
</body>
</html>
